<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopCS Rankings</title>
<meta name="description" content="Zeta Ball SlopCS power rankings.">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1b1b1f;
    --muted: #6b6b75;
    --line: #e6e4df;
    --accent: #c2410c;
    --row-alt: #faf9f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111114;
      --card: #1a1a1f;
      --ink: #ededf0;
      --muted: #9a9aa6;
      --line: #2a2a31;
      --accent: #fb923c;
      --row-alt: #1e1e24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  header { margin-bottom: 18px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 { margin: 4px 0 6px; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); text-align: right; padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: 0; }
  th.l, td.l { text-align: left; }
  .rank { font-weight: 700; font-size: 17px; width: 2.6em; }
  .team { font-weight: 600; overflow-wrap: anywhere; }
  .score { font-weight: 700; }
  .top td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .state { padding: 32px 16px; text-align: center; color: var(--muted); }

  /* Presentation mode (?present): rows stay masked until clicked. */
  body.present main { max-width: 760px; }
  body.present h1 { font-size: 40px; }
  body.present td { padding: 16px 18px; font-size: 20px; }
  body.present .rank { font-size: 24px; }
  body.present tbody tr { cursor: pointer; user-select: none; }
  body.present tr.group-start td { border-top: 16px solid var(--bg); }
  .reveal { position: relative; display: block; }
  /* Fixed-width bars so the mask never hints at name length. */
  .reveal::after {
    content: ''; position: absolute; top: 15%; bottom: 15%; border-radius: 6px;
    background: var(--line); transition: opacity .35s ease;
  }
  td.team .reveal::after { left: 0; width: 11em; }
  td.score .reveal::after { right: 0; width: 4.5em; }
  tr.masked .reveal > span { opacity: 0; }
  tr:not(.masked) .reveal::after { opacity: 0; }
  tr:not(.masked) .reveal > span { opacity: 1; transition: opacity .5s ease .1s; }
  tr.masked:hover .reveal::after { background: color-mix(in srgb, var(--accent) 25%, var(--line)); }
  tr.just-revealed td { animation: pop .9s ease; }
  @keyframes pop {
    0% { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    100% { background: transparent; }
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; }
  @media (max-width: 520px) {
    h1 { font-size: 26px; }
    th, td { padding: 10px 10px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Zeta Ball</div>
    <h1>SlopCS Rankings</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="l">Team</th>
          <th>SlopCS</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="3" class="state">Loading rankings…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="hint" id="hint" hidden>Click a row to reveal · Space / → next · ← undo · G reveal next 3</div>
</main>

<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function seasonLabel(year) {
    return `${year}-${String((year + 1) % 100).padStart(2, '0')}`;
  }

  function score(v) {
    return Number(v).toFixed(2);
  }

  function render(data) {
    const updated = new Date(data.generated_at);
    document.getElementById('meta').textContent =
      `${seasonLabel(data.league_start_year)} season · Through week ${data.through_week} · Updated ${updated.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;

    const cell = (v) => PRESENT ? `<span class="reveal"><span>${v}</span></span>` : v;
    document.getElementById('rows').innerHTML = data.rankings.map((r, i) => {
      const cls = [];
      if (r.rank === 1 && !PRESENT) cls.push('top');
      if (PRESENT) cls.push('masked');
      if (PRESENT && i > 0 && i % GROUP === 0) cls.push('group-start');
      return `
      <tr class="${cls.join(' ')}">
        <td class="rank">${r.rank}</td>
        <td class="l team">${cell(esc(r.team))}</td>
        <td class="score">${cell(score(r.slopcs_score))}</td>
      </tr>`;
    }).join('');

    if (PRESENT) setupPresent();
  }

  // ---- Presentation mode ----
  const PRESENT = new URLSearchParams(location.search).has('present');
  const GROUP = 3;
  if (PRESENT) document.body.classList.add('present');

  function setupPresent() {
    const tbody = document.getElementById('rows');
    const rows = () => [...tbody.querySelectorAll('tr')];
    const history = [];
    document.getElementById('hint').hidden = false;

    function show(tr) {
      if (!tr || !tr.classList.contains('masked')) return;
      tr.classList.remove('masked');
      tr.classList.add('just-revealed');
      setTimeout(() => tr.classList.remove('just-revealed'), 900);
      history.push(tr);
    }
    // Next row to reveal = lowest-ranked still masked (bottom of the table).
    const nextMasked = () => rows().reverse().find((tr) => tr.classList.contains('masked'));

    tbody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      if (tr.classList.contains('masked')) show(tr);
      else { tr.classList.add('masked'); history.splice(history.indexOf(tr), 1); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        show(nextMasked());
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'Backspace') {
        e.preventDefault();
        const tr = history.pop();
        if (tr) tr.classList.add('masked');
      } else if (e.key === 'g' || e.key === 'G') {
        // Reveal the rest of the current bottom group of 3 (e.g. 18, 17, 16).
        const all = rows();
        const first = nextMasked();
        if (!first) return;
        const start = Math.floor(all.indexOf(first) / GROUP) * GROUP;
        all.slice(start, start + GROUP).reverse().forEach((tr, k) => setTimeout(() => show(tr), k * 400));
      }
    });
  }

  fetch('data/latest.json', { cache: 'no-store' })
    .then((res) => {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then(render)
    .catch(() => {
      document.getElementById('meta').textContent = 'No rankings published yet.';
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="3" class="state">Rankings appear after the first week is scored. Check back Monday night.</td></tr>';
    });
</script>
</body>
</html>
